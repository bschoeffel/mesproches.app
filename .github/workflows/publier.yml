# Publication du site sur GitHub Pages depuis le Mac de Benoît (runner auto-hébergé),
# pour ne pas dépendre du quota de minutes GitHub (19/10/2026).
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publier-site
  cancel-in-progress: true

jobs:
  publier:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Préparer l'archive du site
        run: tar --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .

      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - id: deploiement
        uses: actions/deploy-pages@v4
